<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta name="robots" content="noindex, nofollow">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/ding-sifu-web/customer/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ding — 香港裝修維修配對平台：影相出 job，AI 即配已驗證師傅。">

  <!--
    Google Maps JavaScript API key for the customer web app.
    Leave this content empty in git. tool/deploy_web.sh fills it from the
    GOOGLE_MAPS_API_KEY environment variable (or .env.supabase). The same
    value can be compiled in with --dart-define=GOOGLE_MAPS_API_KEY=...
    An empty value keeps the district picker. Restrict the key in Cloud
    Console: HTTP referrers for the Pages host, and Maps JavaScript API only.
    See docs/ops/google-maps.md.
  -->
  <meta name="google-maps-api-key" content="AIzaSyC_KBHzegaGaa0nM10r4-kWk87US-3NJOw">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1E2022">
  <meta name="apple-mobile-web-app-title" content="Ding">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ding</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; background: #ffffff; }
    #ding-boot {
      position: fixed; inset: 0; z-index: 20; background: #ffffff; color: #1c1e21;
      font-family: "Noto Sans HK", "PingFang HK", sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    #ding-boot .ding-skel { width: min(420px, 100%); }
    #ding-boot .bar, #ding-boot .card {
      background: #f7f8fa; border: 1px solid #e5e7eb; border-radius: 12px;
    }
    #ding-boot .bar { height: 18px; width: 42%; margin-bottom: 16px; }
    #ding-boot .card { height: 88px; margin-bottom: 12px; }
    #ding-boot .card.cta { background: #ea6b2d; border-color: #ea6b2d; height: 54px; }
    #ding-boot-fallback { max-width: 420px; }
    #ding-boot-fallback p { line-height: 1.5; margin: 0 0 16px; }
    #ding-boot-fallback button, #ding-boot-fallback a {
      display: inline-block; margin-right: 8px; margin-bottom: 8px;
      padding: 12px 16px; border-radius: 12px; font-weight: 700; text-decoration: none;
    }
    #ding-boot-retry { background: #ea6b2d; color: #fff; border: 0; font: inherit; cursor: pointer; }
    #ding-boot-help { background: #ffffff; color: #1c1e21; border: 1px solid #e5e7eb; }
  </style>
</head>
<body>
  <!--
    Life Design skeleton. Removed on flutter-first-frame.
    After 12s without a frame, offer retry and guest #/help. A slow CanvasKit
    start is not treated as a production outage.
  -->
  <div id="ding-boot" role="status" aria-live="polite">
    <div class="ding-skel" id="ding-boot-skel">
      <div class="bar"></div>
      <div class="card"></div>
      <div class="card"></div>
      <div class="card cta"></div>
    </div>
    <div id="ding-boot-fallback" hidden>
      <p>載入仲未完成。可以重試，或者去幫助中心。測試版，付款為模擬或未開放。幫助中心唔使登入。</p>
      <button type="button" id="ding-boot-retry">重試</button>
      <a id="ding-boot-help" href="#/help">幫助中心</a>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('ding-boot');
      var skel = document.getElementById('ding-boot-skel');
      var fallback = document.getElementById('ding-boot-fallback');
      var painted = false;
      function hide() {
        painted = true;
        if (root && root.parentNode) root.parentNode.removeChild(root);
      }
      window.addEventListener('flutter-first-frame', hide);
      var retry = document.getElementById('ding-boot-retry');
      if (retry) retry.addEventListener('click', function () { window.location.reload(); });
      window.setTimeout(function () {
        if (painted) return;
        if (skel) skel.hidden = true;
        if (fallback) fallback.hidden = false;
      }, 12000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
