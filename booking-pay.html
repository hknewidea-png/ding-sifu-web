<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>預約付款</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:24px;color:#1C1E21;background:#F2F4F5}
    p{line-height:1.5}
  </style>
</head>
<body>
  <p id="msg">前往付款…</p>
  <script src="https://static.airwallex.com/components/sdk/v1/index.js"></script>
  <script>
(async () => {
  const msg = document.getElementById('msg');
  const fail = (t) => { msg.textContent = t || '前往付款失敗。請返去 App 再試。'; };
  try {
    const handoff = new URLSearchParams(location.search).get('handoff') || '';
    if (!/^[0-9a-f]{64}$/.test(handoff)) return fail('付款頁無效。請返去 App 再試。');
    const res = await fetch(
      'https://sqecyzxkefuhlrvgbdjj.supabase.co/functions/v1/airwallex-booking-checkout?handoff=' +
        encodeURIComponent(handoff) + '&format=json',
      { headers: { Accept: 'application/json' } },
    );
    if (!res.ok) return fail('付款頁已過期。請返去 App 再試。');
    const cfg = await res.json();
    if (!cfg.intent_id || !cfg.client_secret) return fail('付款頁已過期。請返去 App 再試。');
    const { payments } = await window.AirwallexComponentsSDK.init({
      env: 'prod',
      enabledElements: ['payments'],
    });
    const options = {
      env: 'prod',
      mode: 'payment',
      intent_id: cfg.intent_id,
      client_secret: cfg.client_secret,
      currency: 'HKD',
      country_code: 'HK',
      successUrl: cfg.successUrl,
      cancelUrl: cfg.cancelUrl,
    };
    if (Array.isArray(cfg.methods) && cfg.methods.length) options.methods = cfg.methods;
    payments.redirectToCheckout(options);
  } catch (e) {
    fail();
  }
})();
  </script>
</body>
</html>
